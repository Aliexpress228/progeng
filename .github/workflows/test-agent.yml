name: Python CI Pipeline

on:
  push:
    branches: [ "main" ] # Аналог галочки "Enable continuous integration"
  workflow_dispatch:     # Аналог кнопки "Save & Queue"

jobs:
  build-and-test:
    # Используем ваш локальный раннер (настроен в ЛБ 4.0)
    runs-on: self-hosted 
    
    steps:
      # 1. Get sources (Получение кода)
      - name: Checkout code
        uses: actions/checkout@v4
        
      # 2. NuGet restore (Установка зависимостей локальным Python)
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
        
      # 3. Build solution (Проверка компиляции/синтаксиса)
      - name: Compile check
        run: python -m compileall app.py
        
      # 4. Test Assemblies (Запуск тестов)
      - name: Run tests
        run: python -m pytest test_app.py -v
